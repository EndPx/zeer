type Block {
  id: ID!
  hash: String!
  previousHash: String!
  time: BigInt!
  transactionCount: Int! @index
}
type BranchBlock {
  id: ID!
  height: Int!
}
type Transaction {
  id: ID!
  txid: String!
  blockHeight: Int! @index
  index: Int!
  version: Int!
  locktime: BigInt!
  sizeBytes: Int!
}
