# Local benchmark adaptation of Zinder v0.6.0's deploy/config/ingest.toml.
[network]
name = "zcash-regtest"
[node]
json_rpc_addr = "http://zebra:18232"
request_timeout_secs = 30
max_response_bytes = 16777216
[node.auth]
method = "none"
[storage]
path = "/var/lib/zinder/canonical"
raw_blob_policy = "transactions"
[storage.canonical.rocksdb]
block_cache_bytes = 67108864
max_wal_bytes = 67108864
max_open_files = 128
write_buffer_bytes = 8388608
max_write_buffer_count = 2
max_background_jobs = 2
memtable_budget_bytes = 67108864
[storage.materialized_views.rocksdb]
block_cache_bytes = 33554432
max_wal_bytes = 33554432
max_open_files = 128
write_buffer_bytes = 8388608
max_write_buffer_count = 2
max_background_jobs = 2
memtable_budget_bytes = 33554432
[ingest]
source = "zebra-json-rpc"
reorg_window_blocks = 100
[ingest.run_overrides]
coverage = "wallet-serving"
[ingest.construction]
source_segment_max_blocks = 32
source_segment_target_response_bytes = 4194304
source_fetch_max_in_flight_requests = 2
source_fetch_max_in_flight_bytes = 67108864
block_prepare_concurrency = 2
block_prepare_memory_watermark_bytes = 67108864
commit_reassembly_max_queued_artifact_bytes = 67108864
canonical_batch_max_blocks = 100
canonical_batch_max_artifact_bytes = 16777216
canonical_batch_max_estimated_write_bytes = 16777216
[ingest_control]
listen_addr = "127.0.0.1:9100"
checkpoint_staging_root = "/var/lib/zinder/checkpoints"
bearer_token_path = "/run/zeer-zinder/ingest.token"
checkpoint_bearer_token_path = "/run/zeer-zinder/checkpoint.token"
[ops]
listen_addr = "127.0.0.1:9105"
