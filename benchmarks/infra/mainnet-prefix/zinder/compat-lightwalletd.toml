# Frozen historical source: uses the actual node readiness endpoint.
[network]
name = "zcash-mainnet"
[node]
json_rpc_addr = "http://zebra:8232"
request_timeout_secs = 30
broadcast_timeout_secs = 7
[node.health]
addr = "http://zebra:18233/ready"
poll_interval_ms = 1000

[node.auth]
method = "none"
[storage]
path = "/var/lib/zinder/canonical"
secondary_path = "/var/lib/zinder/compat/canonical-secondary"
raw_blob_policy = "transactions"
[storage.canonical.rocksdb]
block_cache_bytes = 33554432
max_wal_bytes = 33554432
max_open_files = 128
write_buffer_bytes = 8388608
max_write_buffer_count = 2
max_background_jobs = 2
memtable_budget_bytes = 33554432
[wallet]
path = "/var/lib/zinder/wallet"
secondary_path = "/var/lib/zinder/compat/wallet-secondary"
[wallet.rocksdb]
block_cache_bytes = 33554432
max_wal_bytes = 33554432
max_open_files = 128
write_buffer_bytes = 8388608
max_write_buffer_count = 2
max_background_jobs = 2
memtable_budget_bytes = 33554432
[ingest_control]
addr = "http://127.0.0.1:9100"
bearer_token_path = "/run/zeer-zinder/ingest.token"
[compat]
listen_addr = "0.0.0.0:9067"
reorg_window_blocks = 100
pair_convergence_attempts = 12
[ops]
listen_addr = "127.0.0.1:9107"
[security]
allow_public_bind = true
