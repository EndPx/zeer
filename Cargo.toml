[workspace]
members = ["crates/prep-proto", "crates/prep-store", "crates/prep", "crates/zeer-scanner"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
prep-proto = { path = "crates/prep-proto" }
prep-store = { path = "crates/prep-store" }
prost = "0.14"
tonic = { version = "0.14", features = ["transport", "tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
zstd = { version = "=0.13.3", default-features = false }
memchr = "2"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
axum = "0.8"
base64 = "0.22"

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
